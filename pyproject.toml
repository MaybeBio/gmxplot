[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "gmxplot"
dynamic = ["version"]
authors = [
    { name = "Joe Hoye Dow", email = "luxunisgod123@gmail.com" }
]
description = "GROMACS XVG visualization and statistics with family/kind semantics, physical time axes, windows, replica aggregation, and dashboards"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
license-files = ["LICENSE"]
keywords = ["gromacs", "xvg", "molecular-dynamics", "visualization", "simulation",
"bioinformatics", "rmsd", "rmsf", "energy-plot", "sasa", "trajectory-analysis"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/MaybeBio/gmxplot"
Issues = "https://github.com/MaybeBio/gmxplot/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gmxplot = "gmxplot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gmxplot"]

[tool.hatch.version]
path = "gmxplot/__init__.py"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
